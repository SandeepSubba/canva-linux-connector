name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck xdg-utils desktop-file-utils
      - name: ShellCheck
        run: shellcheck -x bin/canva-affinity install.sh && shellcheck -x -P SCRIPTDIR/.. tests/run-tests.sh
      - name: Tests
        run: tests/run-tests.sh
